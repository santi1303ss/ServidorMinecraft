<div class="card" [class.running]="server().status === 'running'" [class.starting]="server().status === 'starting'" (click)="select.emit()">
  <div class="card-header">
    <div class="card-icon" [class.icon-running]="server().status === 'running'" [class.icon-starting]="server().status === 'starting'" [class.icon-stopped]="server().status === 'stopped'">
      <mc-icon name="server" class="w-5 h-5"/>
    </div>
    <div class="card-info">
      <h3 class="card-name">{{ server().name }}</h3>
      <p class="card-meta">{{ server().engine }} {{ server().version }}</p>
    </div>
    <div class="card-right">
      <span class="badge" [class.badge-running]="server().status === 'running'" [class.badge-starting]="server().status === 'starting'" [class.badge-stopped]="server().status === 'stopped'">
        {{ server().status === 'running' ? 'Running' : server().status === 'starting' ? 'Starting...' : 'Stopped' }}
      </span>
      <button (click)="openConfirm($event)" class="btn-delete">
        <mc-icon name="trash" class="w-3 h-3"/>
        Delete
      </button>
    </div>
  </div>
</div>

@if (showConfirm()) {
  <div class="confirm-overlay" (click)="cancelDelete($event)">
    <div class="confirm-modal" (click)="$event.stopPropagation()">
      <div class="confirm-icon">
        <mc-icon name="warning" class="w-6 h-6"/>
      </div>
      <h3 class="confirm-title">Delete Server</h3>
      <p class="confirm-desc">Type <span class="server-name">{{ server().name }}</span> to confirm deletion.</p>
      <input
        [(ngModel)]="confirmName"
        class="confirm-input"
        [placeholder]="server().name"
        (click)="$event.stopPropagation()"
      />
      <div class="confirm-actions">
        <button (click)="cancelDelete($event)" class="btn-cancel">Cancel</button>
        <button (click)="confirmDelete($event)" [disabled]="!canDelete" class="btn-confirm">Delete</button>
      </div>
    </div>
  </div>
}
